<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0a1a; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 720px; display: flex; flex-direction: column; }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; font-size: 14px; letter-spacing: 1px;
    background: linear-gradient(180deg, rgba(20,20,50,.9), rgba(10,10,26,.6));
    border-bottom: 1px solid rgba(0,255,200,.2);
  }
  #hud span { color: #0ff; text-shadow: 0 0 8px #0ff; }
  #hud .score { color: #ff0; text-shadow: 0 0 8px #ff0; }
  canvas { flex: 1; display: block; width: 100%; background: #0a0a1a; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(10,10,26,.85); backdrop-filter: blur(4px); z-index: 10;
  }
  #overlay h1 {
    font-size: clamp(28px, 8vw, 44px); font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, #0ff, #f0f, #ff0); -webkit-background-clip: text;
    background-clip: text; color: transparent; text-align: center;
  }
  #overlay p { font-size: 14px; color: #aab; text-align: center; max-width: 300px; line-height: 1.6; }
  #overlay button {
    padding: 14px 40px; font-size: 18px; font-weight: 700; letter-spacing: 1px;
    border: 2px solid #0ff; border-radius: 10px; background: transparent; color: #0ff;
    cursor: pointer; text-shadow: 0 0 10px #0ff; box-shadow: 0 0 20px rgba(0,255,200,.3);
    transition: all .2s;
  }
  #overlay button:hover { background: rgba(0,255,200,.15); box-shadow: 0 0 30px rgba(0,255,200,.6); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>SCORE <span class="score" id="score">0</span></div>
    <div>LIVES <span id="lives">3</span></div>
    <div>LEVEL <span id="level">1</span></div>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1>NEON<br>BREAKOUT</h1>
    <p>Move with mouse, finger, or arrow keys. Smash all the bricks. Don't let the ball escape!</p>
    <button id="startBtn">PLAY</button>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // Game state
  let paddle, ball, bricks, particles, score, lives, level, running, animId;
  let mouseX = null;

  const BRICK_COLS = 8, BRICK_ROWS = 5, BRICK_GAP = 4, BRICK_TOP = 50;

  function initLevel(){
    const bw = (W - 24 - (BRICK_COLS-1)*BRICK_GAP) / BRICK_COLS;
    const bh = 22;
    bricks = [];
    const palette = ['#ff0066','#ff6600','#ffcc00','#00ff66','#00ccff'];
    for(let r=0;r<BRICK_ROWS;r++){
      for(let c=0;c<BRICK_COLS;c++){
        bricks.push({
          x: 12 + c*(bw+BRICK_GAP),
          y: BRICK_TOP + r*(bh+BRICK_GAP),
          w: bw, h: bh, alive: true,
          color: palette[r % palette.length],
          hp: r < 1 ? 2 : 1
        });
      }
    }
  }

  function resetBall(){
    ball = { x: W/2, y: H-60, vx: 0, vy: 0, r: 8, stuck: true };
  }

  function startGame(){
    resize();
    score = 0; lives = 3; level = 1;
    paddle = { x: W/2-40, y: H-30, w: 80, h: 12 };
    particles = [];
    initLevel();
    resetBall();
    updateHUD();
    overlay.classList.add('hidden');
    running = true;
    cancelAnimationFrame(animId);
    loop();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
  }

  function spawnParticles(x,y,color){
    for(let i=0;i<8;i++){
      particles.push({
        x,y,
        vx:(Math.random()-.5)*6,
        vy:(Math.random()-.5)*6,
        life:1, color
      });
    }
  }

  function update(){
    // Paddle
    if(mouseX !== null){
      paddle.x = mouseX - paddle.w/2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // Ball
    if(ball.stuck){
      ball.x = paddle.x + paddle.w/2;
      ball.y = paddle.y - ball.r - 2;
    } else {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Walls
      if(ball.x < ball.r){ ball.x = ball.r; ball.vx *= -1; }
      if(ball.x > W-ball.r){ ball.x = W-ball.r; ball.vx *= -1; }
      if(ball.y < ball.r){ ball.y = ball.r; ball.vy *= -1; }

      // Paddle
      if(ball.y + ball.r >= paddle.y && ball.y < paddle.y + paddle.h &&
         ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0){
        ball.vy *= -1;
        let hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
        ball.vx = hit * 6;
        ball.y = paddle.y - ball.r;
      }

      // Bottom = lose life
      if(ball.y > H + 20){
        lives--;
        updateHUD();
        if(lives <= 0){
          gameOver(false);
          return;
        }
        resetBall();
      }

      // Bricks
      for(let b of bricks){
        if(!b.alive) continue;
        if(ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
           ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h){
          // Simple side detection
          let overlapL = (ball.x + ball.r) - b.x;
          let overlapR = (b.x + b.w) - (ball.x - ball.r);
          let overlapT = (ball.y + ball.r) - b.y;
          let overlapB = (b.y + b.h) - (ball.y - ball.r);
          let minH = Math.min(overlapL, overlapR);
          let minV = Math.min(overlapT, overlapB);
          if(minH < minV) ball.vx *= -1; else ball.vy *= -1;

          b.hp--;
          if(b.hp <= 0){
            b.alive = false;
            score += 10 * level;
            spawnParticles(b.x+b.w/2, b.y+b.h/2, b.color);
          } else {
            score += 5;
          }
          updateHUD();
          break;
        }
      }

      // Level complete
      if(bricks.every(b=>!b.alive)){
        level++;
        updateHUD();
        initLevel();
        resetBall();
        // Speed up
      }
    }

    // Particles
    for(let p of particles){
      p.x += p.vx; p.y += p.vy; p.vy += .2; p.life -= .03;
    }
    particles = particles.filter(p=>p.life > 0);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // Bricks
    for(let b of bricks){
      if(!b.alive) continue;
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = b.color;
      roundRect(ctx, b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.restore();
    }

    // Paddle
    ctx.save();
    ctx.shadowColor = '#0ff'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#0ff';
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
    ctx.restore();

    // Ball
    ctx.save();
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Particles
    for(let p of particles){
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-2, p.y-2, 4, 4);
      ctx.restore();
    }
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(){
    if(!running) return;
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function gameOver(win){
    running = false;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').innerHTML = win ? 'YOU WIN!' : 'GAME<br>OVER';
    overlay.querySelector('p').textContent = 'Final score: ' + score;
    startBtn.textContent = 'PLAY AGAIN';
  }

  // Input
  function setMouse(clientX){
    const rect = canvas.getBoundingClientRect();
    mouseX = clientX - rect.left;
  }
  canvas.addEventListener('mousemove', e=>setMouse(e.clientX));
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); setMouse(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchstart', e=>{ setMouse(e.touches[0].clientX); if(ball && ball.stuck) launch(); }, {passive:false});
  canvas.addEventListener('click', ()=>{ if(ball && ball.stuck) launch(); });
  window.addEventListener('keydown', e=>{
    if(e.key === 'ArrowLeft') mouseX = (mouseX||W/2) - 24;
    if(e.key === 'ArrowRight') mouseX = (mouseX||W/2) + 24;
    if(e.key === ' ' || e.key === 'Enter'){ if(ball && ball.stuck) launch(); }
  });

  function launch(){
    if(!ball || !ball.stuck) return;
    ball.stuck = false;
    let angle = (-Math.PI/2) + (Math.random()-.5)*0.6;
    let speed = 5 + level*0.3;
    ball.vx = Math.cos(angle)*speed;
    ball.vy = Math.sin(angle)*speed;
  }

  startBtn.addEventListener('click', startGame);
  resize();
})();
</script>
</body>
